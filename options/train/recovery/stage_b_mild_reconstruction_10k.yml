# Stage B: bounded pixel-only robustness pilot with an offline 50/50 clean and
# mild paired dataset. Replace the checkpoint sentinel only after Stage A passes.
name: recovery_stage_b_mild_reconstruction_10k
model_type: HATModel
scale: 4
num_gpu: 1
manual_seed: 20260820
auto_resume: false

recovery_contract:
  stage: B
  purpose: mild_degradation_reconstruction
  requires_accepted_checkpoint: stage_a
  clean_dataset_fraction: 0.5
  decision_iter: 10000

datasets:
  train:
    name: FaceRecoveryMildMixedTrain50Clean
    type: PairedImageDataset
    dataroot_gt: /home/hermes/hat-face-training/data/face_sr_recovery/mild_mixed/train/gt
    dataroot_lq: /home/hermes/hat-face-training/data/face_sr_recovery/mild_mixed/train/lq
    meta_info_file: /home/hermes/hat-face-training/data/face_sr_recovery/mild_mixed/train/meta_info.txt
    filename_tmpl: '{}'
    io_backend:
      type: disk
    gt_size: 256
    use_hflip: true
    use_rot: false
    use_shuffle: true
    num_worker_per_gpu: 2
    batch_size_per_gpu: 2
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val_clean:
    name: FaceRecoveryCleanPilot
    type: PairedImageDataset
    dataroot_gt: /home/hermes/hat-face-training/data/face_sr_recovery/benchmarks/clean_pilot/gt
    dataroot_lq: /home/hermes/hat-face-training/data/face_sr_recovery/benchmarks/clean_pilot/lq
    meta_info_file: /home/hermes/hat-face-training/data/face_sr_recovery/benchmarks/clean_pilot/meta_info.txt
    filename_tmpl: '{}'
    io_backend:
      type: disk

  val_mild:
    name: FaceRecoveryMildPilot
    type: PairedImageDataset
    dataroot_gt: /home/hermes/hat-face-training/data/face_sr_recovery/benchmarks/mild_pilot/gt
    dataroot_lq: /home/hermes/hat-face-training/data/face_sr_recovery/benchmarks/mild_pilot/lq
    meta_info_file: /home/hermes/hat-face-training/data/face_sr_recovery/benchmarks/mild_pilot/meta_info.txt
    filename_tmpl: '{}'
    io_backend:
      type: disk

  val_hard:
    name: FaceRecoveryHardPilot
    type: PairedImageDataset
    dataroot_gt: /home/hermes/hat-face-training/data/face_sr_recovery/benchmarks/hard_pilot/gt
    dataroot_lq: /home/hermes/hat-face-training/data/face_sr_recovery/benchmarks/hard_pilot/lq
    meta_info_file: /home/hermes/hat-face-training/data/face_sr_recovery/benchmarks/hard_pilot/meta_info.txt
    filename_tmpl: '{}'
    io_backend:
      type: disk

network_g:
  type: HAT
  upscale: 4
  in_chans: 3
  img_size: 64
  window_size: 16
  compress_ratio: 24
  squeeze_factor: 24
  conv_scale: 0.01
  overlap_ratio: 0.5
  img_range: 1.0
  depths: [6, 6, 6, 6, 6, 6]
  embed_dim: 144
  num_heads: [6, 6, 6, 6, 6, 6]
  mlp_ratio: 2
  upsampler: pixelshuffle
  resi_connection: 1conv

path:
  # Intentionally nonexistent. Supply an accepted Stage A net_g checkpoint.
  pretrain_network_g: /home/hermes/hat-face-training/HAT/experiments/__ACCEPTED_STAGE_A__/models/net_g_5000.pth
  param_key_g: params_ema
  strict_load_g: true
  resume_state: ~

train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: !!float 1e-5
    weight_decay: 0
    betas: [0.9, 0.99]
  scheduler:
    type: MultiStepLR
    milestones: [8000]
    gamma: 0.5
  total_iter: 10000
  warmup_iter: -1
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

val:
  val_freq: 1000
  save_img: false
  pbar: false
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 4
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: true

logger:
  print_freq: 100
  save_checkpoint_freq: 1000
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

dist_params:
  backend: gloo
  port: 29500
