# Stage A: bounded clean-fidelity pilot. This is the only recovery stage that
# may start directly from the published HAT-S checkpoint.
name: recovery_stage_a_clean_fidelity_5k
model_type: HATModel
scale: 4
num_gpu: 1
manual_seed: 20260820
auto_resume: false

recovery_contract:
  stage: A
  purpose: clean_bicubic_fidelity
  requires_accepted_checkpoint: false
  decision_iter: 5000

datasets:
  train:
    name: FaceRecoveryCleanTrain
    type: PairedImageDataset
    dataroot_gt: /home/hermes/hat-face-training/data/face_sr_recovery/clean/train/gt
    dataroot_lq: /home/hermes/hat-face-training/data/face_sr_recovery/clean/train/lq
    meta_info_file: /home/hermes/hat-face-training/data/face_sr_recovery/clean/train/meta_info.txt
    filename_tmpl: '{}'
    io_backend:
      type: disk
    gt_size: 256
    use_hflip: true
    use_rot: false
    use_shuffle: true
    num_worker_per_gpu: 2
    batch_size_per_gpu: 2
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val_clean:
    name: FaceRecoveryCleanPilot
    type: PairedImageDataset
    dataroot_gt: /home/hermes/hat-face-training/data/face_sr_recovery/benchmarks/clean_pilot/gt
    dataroot_lq: /home/hermes/hat-face-training/data/face_sr_recovery/benchmarks/clean_pilot/lq
    meta_info_file: /home/hermes/hat-face-training/data/face_sr_recovery/benchmarks/clean_pilot/meta_info.txt
    filename_tmpl: '{}'
    io_backend:
      type: disk

network_g:
  type: HAT
  upscale: 4
  in_chans: 3
  img_size: 64
  window_size: 16
  compress_ratio: 24
  squeeze_factor: 24
  conv_scale: 0.01
  overlap_ratio: 0.5
  img_range: 1.0
  depths: [6, 6, 6, 6, 6, 6]
  embed_dim: 144
  num_heads: [6, 6, 6, 6, 6, 6]
  mlp_ratio: 2
  upsampler: pixelshuffle
  resi_connection: 1conv

path:
  pretrain_network_g: /home/hermes/hat-face-training/HAT/experiments/pretrained_models/HAT-S_SRx4.pth
  param_key_g: params_ema
  strict_load_g: true
  resume_state: ~

train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: !!float 5e-6
    weight_decay: 0
    betas: [0.9, 0.99]
  scheduler:
    type: MultiStepLR
    milestones: [4000]
    gamma: 0.5
  total_iter: 5000
  warmup_iter: -1
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

val:
  val_freq: 500
  save_img: false
  pbar: false
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 4
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: true

logger:
  print_freq: 100
  save_checkpoint_freq: 500
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

dist_params:
  backend: gloo
  port: 29500
