# Materialize this template only through recovery.inference.pilot_matrix.
# The placeholders make accidental direct execution fail before model loading.
name: __EXPERIMENT_NAME__
model_type: HATModel
scale: 4
num_gpu: 1
manual_seed: 0

datasets:
  test_clean:
    name: face_recovery_clean_pilot
    type: PairedImageDataset
    dataroot_gt: /home/hermes/hat-face-training/data/face_sr_recovery/benchmarks/clean_pilot/gt
    dataroot_lq: /home/hermes/hat-face-training/data/face_sr_recovery/benchmarks/clean_pilot/lq
    io_backend:
      type: disk
  test_mild:
    name: face_recovery_mild_pilot
    type: PairedImageDataset
    dataroot_gt: /home/hermes/hat-face-training/data/face_sr_recovery/benchmarks/mild_pilot/gt
    dataroot_lq: /home/hermes/hat-face-training/data/face_sr_recovery/benchmarks/mild_pilot/lq
    io_backend:
      type: disk
  test_hard:
    name: face_recovery_hard_pilot
    type: PairedImageDataset
    dataroot_gt: /home/hermes/hat-face-training/data/face_sr_recovery/benchmarks/hard_pilot/gt
    dataroot_lq: /home/hermes/hat-face-training/data/face_sr_recovery/benchmarks/hard_pilot/lq
    io_backend:
      type: disk

network_g:
  type: HAT
  upscale: 4
  in_chans: 3
  img_size: 64
  window_size: 16
  compress_ratio: 24
  squeeze_factor: 24
  conv_scale: 0.01
  overlap_ratio: 0.5
  img_range: 1.0
  depths: [6, 6, 6, 6, 6, 6]
  embed_dim: 144
  num_heads: [6, 6, 6, 6, 6, 6]
  mlp_ratio: 2
  upsampler: pixelshuffle
  resi_connection: 1conv

path:
  pretrain_network_g: __CHECKPOINT__
  strict_load_g: true
  param_key_g: params_ema
  results_root: __RESULTS_ROOT__

val:
  save_img: true
  suffix: __MODEL_ID__
  pbar: false
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 4
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: true
