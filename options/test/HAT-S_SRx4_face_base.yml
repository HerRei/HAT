name: HAT-S_SRx4_base_on_faces
model_type: HATModel
scale: 4
num_gpu: 1
manual_seed: 0

datasets:
  test_1:
    name: FFHQ_face_val_base
    type: PairedImageDataset
    dataroot_gt: /home/hermes/hat-face-training/data/ffhq_face_sr_v2/val/gt
    dataroot_lq: /home/hermes/hat-face-training/data/ffhq_face_sr_v2/val/lq
    io_backend:
      type: disk

network_g:
  type: HAT
  upscale: 4
  in_chans: 3
  img_size: 64
  window_size: 16
  compress_ratio: 24
  squeeze_factor: 24
  conv_scale: 0.01
  overlap_ratio: 0.5
  img_range: 1.
  depths: [6, 6, 6, 6, 6, 6]
  embed_dim: 144
  num_heads: [6, 6, 6, 6, 6, 6]
  mlp_ratio: 2
  upsampler: pixelshuffle
  resi_connection: 1conv

path:
  pretrain_network_g: experiments/pretrained_models/HAT-S_SRx4.pth
  strict_load_g: true
  param_key_g: params_ema

val:
  save_img: true
  suffix: base

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 4
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: true